name: Validate library

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test and evaluate (offline)
    runs-on: ubuntu-24.04  # poppler 24.02: catalogs are reproduced byte-for-byte
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify pinned source PDFs
        run: python scripts/verify_source_pdfs.py
      - name: Catalogs reproduce from pinned PDFs
        run: for f in scripts/extract/*.py; do python "$f" --check || exit 1; done
      - name: Registry is current
        run: python -m agentlib registry --check
      - name: Structural validation
        run: python -m agentlib validate
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Offline evaluation (goldens pass, negatives fail)
        run: python -m agentlib eval --mode offline --json eval-results.json
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-py${{ matrix.python-version }}
          path: eval-results.json
          if-no-files-found: ignore

  install-smoke:
    name: Install into a fresh repository
    runs-on: ubuntu-24.04  # poppler 24.02: catalogs are reproduced byte-for-byte
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Install library into a scratch repository and check the result
        run: |
          mkdir -p /tmp/consumer && git -C /tmp/consumer init -q
          python -m agentlib install /tmp/consumer --components skills agents commands workflows templates catalog
          test -f /tmp/consumer/.agent-library.lock.json
          ls /tmp/consumer/.claude/skills
          n=$(ls /tmp/consumer/.claude/skills | wc -l)
          test "$n" -ge 1
      - name: Package builds and CLI entry point works
        run: |
          python -m pip install .
          cd /tmp && AGENTLIB_ROOT="$GITHUB_WORKSPACE" agentlib list skills

  action-smoke:
    name: Reusable action works from a consumer's perspective
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - name: Prepare a consumer workspace
        run: |
          mkdir -p /tmp/consumer/docs
          printf 'Code review is enforced [nist-ssdf PW.7.1, p. 23].\n' > /tmp/consumer/docs/good.md
          printf 'We follow SWE-999 [nist-ssdf, p. 999].\n' > /tmp/consumer/docs/bad.md
      - name: Passing check
        uses: ./
        with:
          working-directory: /tmp/consumer
          args: evidence check docs/good.md --require-citations
      - name: Failing check must fail
        id: bad
        continue-on-error: true
        uses: ./
        with:
          working-directory: /tmp/consumer
          args: evidence check docs/bad.md
      - name: Assert the failing check failed
        run: test "${{ steps.bad.outcome }}" = "failure"
