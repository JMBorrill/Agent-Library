name: Live skill evaluations

# Calls the Claude API: manual trigger only, needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill to evaluate (blank = all)"
        required: false
      model:
        description: "Model id"
        required: false
        default: "claude-sonnet-5-5"
      native:
        description: "Also run native Claude Code plugin evals (plugin-evals/)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt anthropic
      - name: Run live evaluations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args="--mode live --model ${{ inputs.model }} --json live-results.json"
          if [ -n "${{ inputs.skill }}" ]; then args="$args --skill ${{ inputs.skill }}"; fi
          python -m agentlib eval $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval-results
          path: |
            live-results.json
            evals/results/

  native-plugin-evals:
    if: ${{ inputs.native }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: |
          python -m pip install -r requirements-dev.txt
          npm install -g @anthropic-ai/claude-code
      - name: Run native plugin evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --allow-tools Bash --runs 1 --threshold 0.66 \
            --max-cost-usd 10 --no-publish --json plugin-eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugin-eval-results
          path: |
            plugin-eval-results.json
            plugin-evals/results/
