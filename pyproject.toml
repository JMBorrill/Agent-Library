[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlib"
version = "0.1.0"
description = "Professional AI agent, skill and framework library: validators, framework tools and evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "jsonschema>=4.17"]

[project.optional-dependencies]
dev = ["pytest>=7"]
live = ["anthropic>=0.40"]

[project.scripts]
agentlib = "agentlib.cli:main"

[tool.setuptools.packages.find]
include = ["agentlib*"]

[tool.setuptools.package-data]
agentlib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
